name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- OhMyCode.xcodeproj
      # Wall-clock tests are skipped here: shared runners are slower; they run locally.
      - name: Build and test
        run: >
          xcodebuild test -project OhMyCode.xcodeproj -scheme OhMyCode
          -destination 'platform=macOS' -only-testing:OhMyCodeTests
          -skip-testing:OhMyCodeTests/PerformanceGuardTests
          -skip-testing:OhMyCodeTests/KeystrokeGuardTests
          '-skip-testing:OhMyCodeTests/BigEditTests/pastingOverALongFileFromFarDown()'
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
