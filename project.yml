name: OhMyCode
options:
  bundleIdPrefix: dev.zerovoid99
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
packages:
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    exactVersion: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    exactVersion: 0.7.4-with-generated-files
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.23.1
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    exactVersion: 0.23.2
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python
    exactVersion: 0.23.6
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: 0.24.8
  TreeSitterRust:
    url: https://github.com/tree-sitter/tree-sitter-rust
    exactVersion: 0.24.2
  GhosttyVt:
    path: Packages/GhosttyVt
  TreeSitterGo:
    url: https://github.com/tree-sitter/tree-sitter-go
    exactVersion: 0.23.4
targets:
  OhMyCode:
    type: application
    platform: macOS
    sources:
      - path: OhMyCode
        excludes:
          - Resources/CommandLine
      # The omc command (Install "omc" Command links it from the PATH).
      - path: OhMyCode/Resources/CommandLine/omc
        buildPhase: resources
      # The API's types, copied into new extensions.
      - path: ExtensionAPI/omc.d.ts
        buildPhase: resources
    info:
      path: OhMyCode/Info.plist
      properties:
        # ohmycode://open?path=…&line=… (the omc command).
        CFBundleURLTypes:
          - CFBundleURLName: dev.zerovoid99.ohmycode.open
            CFBundleURLSchemes: [ohmycode]
        # Folders and text files from Finder (Open With, the Dock icon).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Source Code
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.source-code, public.script, public.shell-script, public.text, public.plain-text, public.json, public.xml, public.yaml, net.daringfireball.markdown]
    dependencies:
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterJavaScript
      - package: TreeSitterTypeScript
        product: TreeSitterTypeScript
      - package: TreeSitterPython
      - package: TreeSitterJSON
      - package: TreeSitterRust
      - package: TreeSitterGo
      - package: GhosttyVt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zerovoid99.ohmycode
        PRODUCT_NAME: Oh My Code
        INFOPLIST_KEY_CFBundleDisplayName: Oh My Code
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OhMyCode/OhMyCode.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  OhMyCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OhMyCodeTests
        excludes:
          - Fixtures
      - path: OhMyCodeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: OhMyCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zerovoid99.ohmycode.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Oh My Code.app/Contents/MacOS/Oh My Code"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OhMyCode:
    build:
      targets:
        OhMyCode: all
        OhMyCodeTests: [test]
    test:
      targets:
        - OhMyCodeTests
